<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部航空作品 | Hugo.aviation</title>
  <meta name="description" content="浏览 Hugo.aviation 的全部航空摄影作品，并按机型、航空公司、机场、飞行阶段和时间筛选。">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://example.com/works">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- BUILD:WORKS_PRELOAD -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="Hugo.aviation">
  <meta property="og:title" content="全部航空作品 | Hugo.aviation">
  <meta property="og:description" content="按机型、航空公司、机场、飞行阶段和时间浏览航空摄影作品。">
  <meta property="og:url" content="https://example.com/works">
  <meta property="og:image" content="https://example.com/assets/demo.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="全部航空作品 | Hugo.aviation">
  <meta name="twitter:description" content="按机型、航空公司、机场、飞行阶段和时间浏览航空摄影作品。">
  <meta name="twitter:image" content="https://example.com/assets/demo.svg">
  <link rel="stylesheet" href="assets/generated/works.css">
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"></div>

  <header class="top-controls" aria-label="作品页导航">
    <a class="home-control" href="/" aria-label="返回首页"></a>
    <nav class="filter-tabs" aria-label="作品分类">
      <button class="filter-tab is-active" type="button" data-catalog-key="all" aria-pressed="true">全部</button>
      <button class="filter-tab" type="button" data-catalog-key="time" aria-controls="catalogPanel" aria-expanded="false">时间</button>
      <button class="filter-tab" type="button" data-catalog-key="airline" aria-controls="catalogPanel" aria-expanded="false">航司</button>
      <button class="filter-tab" type="button" data-catalog-key="aircraft" aria-controls="catalogPanel" aria-expanded="false">机型</button>
      <button class="filter-tab" type="button" data-catalog-key="airport" aria-controls="catalogPanel" aria-expanded="false">机场</button>
      <button class="filter-tab" type="button" data-catalog-key="phase" aria-controls="catalogPanel" aria-expanded="false">阶段</button>
    </nav>
    <button class="search-control" id="searchControl" type="button" aria-label="搜索作品" aria-controls="searchPanel" aria-expanded="false">
      <span class="search-icon" aria-hidden="true"></span>
    </button>
  </header>

  <section class="catalog-panel" id="catalogPanel" aria-label="作品分类选项" aria-hidden="true" inert>
    <div class="catalog-heading">
      <span class="catalog-title" id="catalogTitle"></span>
      <span class="catalog-result" id="catalogResult" aria-live="polite"></span>
    </div>
    <div class="catalog-options" id="catalogOptions" role="group"></div>
    <div class="catalog-footer">
      <label class="catalog-mode" for="catalogMultiSelect">
        <span>多选</span>
        <input id="catalogMultiSelect" type="checkbox" role="switch">
        <span class="catalog-switch" aria-hidden="true"></span>
      </label>
      <div class="catalog-actions">
        <button class="catalog-clear" id="catalogClear" type="button" disabled>清除此项</button>
        <button class="catalog-reset" id="catalogReset" type="button" disabled>重置全部</button>
      </div>
    </div>
  </section>

  <form class="search-panel" id="searchPanel" role="search" aria-label="搜索航空作品" aria-hidden="true" inert>
    <span class="search-icon" aria-hidden="true"></span>
    <input class="search-input" id="searchInput" type="search" name="q" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="搜索机型、航司、机场或文件名" aria-label="搜索机型、航司、机场或文件名">
    <span class="search-result" id="searchResult" aria-live="polite"></span>
    <button class="search-clear" id="searchClear" type="button" aria-label="清除搜索" disabled></button>
    <button class="sr-only" type="submit">搜索</button>
  </form>

  <main>
    <h1 class="sr-only">全部航空摄影作品</h1>
    <div class="works-grid" id="worksGrid"></div>
    <!-- BUILD:WORKS_FALLBACK -->
    <div class="works-empty" id="worksEmpty" hidden>
      <span>暂无匹配作品</span>
      <button class="empty-reset" id="emptyReset" type="button">清除筛选</button>
    </div>
    <div class="load-sentinel" id="loadSentinel" aria-hidden="true"></div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片预览" aria-hidden="true" inert>
    <button class="lightbox-button lightbox-close" type="button" aria-label="关闭预览">×</button>
    <button class="lightbox-button lightbox-prev" type="button" aria-label="上一张"></button>
    <div class="lightbox-figure">
      <div class="lightbox-media">
        <img class="lightbox-image is-active" id="lightboxImage" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" decoding="async">
        <img class="lightbox-image" id="lightboxImageBuffer" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" decoding="async" aria-hidden="true">
      </div>
      <div class="lightbox-info" id="lightboxInfo" aria-label="照片信息" tabindex="0">
        <div class="lightbox-info-track" aria-live="polite">
          <strong class="lightbox-info-title" id="lightboxInfoTitle"></strong>
          <span class="lightbox-info-divider" aria-hidden="true"></span>
          <span class="lightbox-info-basic" id="lightboxInfoBasic"></span>
        </div>
      </div>
    </div>
    <button class="lightbox-button lightbox-next" type="button" aria-label="下一张"></button>
  </div>

  <!-- BUILD:INITIAL_WORKS_DATA -->
  <script src="assets/generated/works.js" defer></script>
</body>
</html>
